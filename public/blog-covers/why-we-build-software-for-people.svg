<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="85%" r="70%">
      <stop offset="0" stop-color="#06d6e0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06d6e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="10%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e8f4f5" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#0a1214"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <text x="800" y="205" text-anchor="middle" font-size="30" letter-spacing="9" fill="#06d6e0" font-weight="700">OUR PROMISE</text>
  <text x="800" y="320" text-anchor="middle" font-size="108" font-weight="800" fill="#e8f4f5">Software for People</text>
  <text x="800" y="392" text-anchor="middle" font-size="36" fill="#e8f4f5" fill-opacity="0.72">A win for the client, their customers and us.</text>

  <!-- three overlapping circles -->
  <g stroke-width="5">
    <circle cx="600" cy="610" r="125" fill="#06d6e0" fill-opacity="0.16" stroke="#06d6e0"/>
    <circle cx="800" cy="610" r="125" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/>
    <circle cx="1000" cy="610" r="125" fill="#e8f4f5" fill-opacity="0.1" stroke="#e8f4f5" stroke-opacity="0.75"/>
  </g>
  <text x="565" y="618" text-anchor="middle" font-size="30" font-weight="700" fill="#e8f4f5">Client</text>
  <text x="800" y="618" text-anchor="middle" font-size="30" font-weight="700" fill="#e8f4f5">Users</text>
  <text x="1035" y="618" text-anchor="middle" font-size="30" font-weight="700" fill="#e8f4f5">Us</text>

  <text x="800" y="850" text-anchor="middle" font-size="22" letter-spacing="4" fill="#e8f4f5" fill-opacity="0.45">KASAULICODER</text>
</svg>
