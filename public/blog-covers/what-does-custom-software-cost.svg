<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="85%" r="70%">
      <stop offset="0" stop-color="#06d6e0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06d6e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="10%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e8f4f5" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#0a1214"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <text x="800" y="205" text-anchor="middle" font-size="30" letter-spacing="9" fill="#06d6e0" font-weight="700">AN HONEST GUIDE</text>
  <text x="800" y="320" text-anchor="middle" font-size="108" font-weight="800" fill="#e8f4f5">What Software Costs</text>
  <text x="800" y="392" text-anchor="middle" font-size="36" fill="#e8f4f5" fill-opacity="0.72">What you pay for, what to ask, and how to start small.</text>

  <!-- five equal blocks: what you pay for (equal widths on purpose, no proportions implied) -->
  <g font-size="26" font-weight="700" fill="#e8f4f5" text-anchor="middle">
    <rect x="280" y="530" width="210" height="150" rx="24" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="5"/>
    <text x="385" y="615">Discover</text>
    <rect x="510" y="530" width="210" height="150" rx="24" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="5"/>
    <text x="615" y="615">Design</text>
    <rect x="740" y="530" width="210" height="150" rx="24" fill="#06d6e0" fill-opacity="0.16" stroke="#06d6e0" stroke-width="5"/>
    <text x="845" y="615">Build</text>
    <rect x="970" y="530" width="210" height="150" rx="24" fill="#06d6e0" fill-opacity="0.16" stroke="#06d6e0" stroke-width="5"/>
    <text x="1075" y="615">Host</text>
    <rect x="1200" y="530" width="210" height="150" rx="24" fill="#e8f4f5" fill-opacity="0.1" stroke="#e8f4f5" stroke-opacity="0.75" stroke-width="5"/>
    <text x="1305" y="615">Care</text>
  </g>
  <text x="800" y="740" text-anchor="middle" font-size="26" fill="#e8f4f5" fill-opacity="0.6">The build is not the whole bill.</text>

  <text x="800" y="850" text-anchor="middle" font-size="22" letter-spacing="4" fill="#e8f4f5" fill-opacity="0.45">KASAULICODER</text>
</svg>
