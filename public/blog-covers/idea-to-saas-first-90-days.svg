<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="85%" r="70%">
      <stop offset="0" stop-color="#06d6e0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06d6e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="10%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" x2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06d6e0"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e8f4f5" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#0a1214"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- title block -->
  <text x="800" y="205" text-anchor="middle" font-size="30" letter-spacing="9" fill="#06d6e0" font-weight="700">THE FIRST 90 DAYS</text>
  <text x="800" y="320" text-anchor="middle" font-size="108" font-weight="800" fill="#e8f4f5">From Idea to SaaS</text>
  <text x="800" y="392" text-anchor="middle" font-size="36" fill="#e8f4f5" fill-opacity="0.72">Listen. Build small. Learn from real customers.</text>

  <!-- path -->
  <path d="M250 640 C 400 560, 460 720, 600 640 S 820 560, 960 640 S 1180 720, 1330 640"
        fill="none" stroke="url(#path)" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 24"/>
  <path d="M250 640 C 400 560, 460 720, 600 640 S 820 560, 960 640 S 1180 720, 1330 640"
        fill="none" stroke="url(#path)" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- start: idea bulb -->
  <g transform="translate(250 640)">
    <circle r="62" fill="#0a1214"/><circle r="62" fill="#6366f1" fill-opacity="0.18" stroke="#6366f1" stroke-width="4"/>
    <circle cy="-8" r="22" fill="none" stroke="#e8f4f5" stroke-width="5"/>
    <path d="M-10 18 H10 M-7 28 H7" stroke="#e8f4f5" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 -44 V-52 M-34 -30 L-40 -36 M34 -30 L40 -36" stroke="#e8f4f5" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="250" y="745" text-anchor="middle" font-size="28" font-weight="700" fill="#e8f4f5">Your idea</text>

  <!-- milestone 1 -->
  <g transform="translate(600 640)">
    <circle r="40" fill="#0a1214" stroke="#06d6e0" stroke-width="5"/>
    <text y="12" text-anchor="middle" font-size="34" font-weight="800" fill="#06d6e0">1</text>
  </g>
  <text x="600" y="745" text-anchor="middle" font-size="28" font-weight="700" fill="#e8f4f5">Listen</text>
  <text x="600" y="780" text-anchor="middle" font-size="22" fill="#e8f4f5" fill-opacity="0.65">Days 1–30</text>

  <!-- milestone 2 -->
  <g transform="translate(960 640)">
    <circle r="40" fill="#0a1214" stroke="#06d6e0" stroke-width="5"/>
    <text y="12" text-anchor="middle" font-size="34" font-weight="800" fill="#06d6e0">2</text>
  </g>
  <text x="960" y="745" text-anchor="middle" font-size="28" font-weight="700" fill="#e8f4f5">Build small</text>
  <text x="960" y="780" text-anchor="middle" font-size="22" fill="#e8f4f5" fill-opacity="0.65">Days 31–60</text>

  <!-- end: real customer -->
  <g transform="translate(1330 640)">
    <circle r="62" fill="#0a1214"/><circle r="62" fill="#06d6e0" fill-opacity="0.18" stroke="#06d6e0" stroke-width="4"/>
    <circle cy="-14" r="17" fill="#e8f4f5"/>
    <path d="M-30 32 C-30 8, 30 8, 30 32 Z" fill="#e8f4f5"/>
  </g>
  <text x="1330" y="745" text-anchor="middle" font-size="28" font-weight="700" fill="#e8f4f5">Real users</text>
  <text x="1330" y="780" text-anchor="middle" font-size="22" fill="#e8f4f5" fill-opacity="0.65">Days 61–90</text>

  <text x="800" y="850" text-anchor="middle" font-size="22" letter-spacing="4" fill="#e8f4f5" fill-opacity="0.45">KASAULICODER</text>
</svg>
