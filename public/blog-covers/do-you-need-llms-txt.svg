<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="85%" r="70%">
      <stop offset="0" stop-color="#06d6e0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06d6e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="10%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e8f4f5" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#0a1214"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <text x="800" y="205" text-anchor="middle" font-size="30" letter-spacing="9" fill="#06d6e0" font-weight="700">WHAT THE EVIDENCE SAYS</text>
  <text x="800" y="320" text-anchor="middle" font-size="96" font-weight="800" fill="#e8f4f5">Do You Need llms.txt?</text>
  <text x="800" y="392" text-anchor="middle" font-size="36" fill="#e8f4f5" fill-opacity="0.72">What it is, who reads it, and when it is worth adding.</text>

  <!-- equal blocks on purpose: no proportions implied -->
  <g font-size="26" font-weight="700" fill="#e8f4f5" text-anchor="middle">
    <rect x="270" y="530" width="250" height="150" rx="24" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="1" stroke-width="5"/>
    <text x="395" y="615">What it is</text>
    <rect x="540" y="530" width="250" height="150" rx="24" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-opacity="1" stroke-width="5"/>
    <text x="665" y="615">Who reads it</text>
    <rect x="810" y="530" width="250" height="150" rx="24" fill="#06d6e0" fill-opacity="0.16" stroke="#06d6e0" stroke-opacity="1" stroke-width="5"/>
    <text x="935" y="615">What Google says</text>
    <rect x="1080" y="530" width="250" height="150" rx="24" fill="#e8f4f5" fill-opacity="0.1" stroke="#e8f4f5" stroke-opacity="0.75" stroke-width="5"/>
    <text x="1205" y="615">When to add it</text>
  </g>
  <text x="800" y="740" text-anchor="middle" font-size="26" fill="#e8f4f5" fill-opacity="0.6">For most business websites, the basics matter more.</text>

  <text x="800" y="850" text-anchor="middle" font-size="22" letter-spacing="4" fill="#e8f4f5" fill-opacity="0.45">KASAULICODER</text>
</svg>
